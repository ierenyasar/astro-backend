  #     - run: npm run preflight
  #       env:
  #         DATABASE_URL: ${{ secrets.DATABASE_URL }}
  #         JWT_SECRET: ${{ secrets.JWT_SECRET }}
  #         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  #         # ... diğer production secret'ları
